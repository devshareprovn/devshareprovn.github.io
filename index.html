<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogger Analyzer - Liquid Glass Admin Panel</title>
    <meta name="description" content="Công cụ tra cứu và phân tích thông tin website Blogspot siêu tốc. Kiểm tra ngày tạo, số bài viết, trang và tác giả với giao diện Liquid Glass hiện đại.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Blogger Analyzer",
      "description": "Công cụ tra cứu thông tin chi tiết của nền tảng Blogger/Blogspot.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All"
    }
    </script>
    <style>
        /* ================= CƠ BẢN & UI LIQUID GLASS ================= */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%), url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Glassmorphism Class */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            padding: 25px;
            margin-bottom: 25px;
        }

        h1, h2 { margin-top: 0; text-align: center; font-weight: 300; letter-spacing: 1px;}
        
        /* Form Tra Cứu */
        .search-box {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .search-box input {
            flex: 1;
            max-width: 500px;
            padding: 15px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.7); }
        .search-box input:focus { background: rgba(255,255,255,0.25); box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .search-box button {
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: transform 0.2s;
        }
        .search-box button:hover { transform: translateY(-2px); }

        /* Lưới Thống Kê (Grid) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card h3 { margin: 0; font-size: 14px; color: #a8c0ff; text-transform: uppercase;}
        .stat-card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; }

        /* Hệ thống Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none; border: none; color: #fff; padding: 15px 30px; font-size: 16px;
            cursor: pointer; opacity: 0.6; transition: all 0.3s; position: relative;
        }
        .tab-btn.active { opacity: 1; font-weight: bold; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px;
            background: #00c6ff; border-radius: 3px 3px 0 0;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }

        /* Danh sách bài viết/trang */
        .item-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
        .item-list li {
            background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent;
            transition: all 0.3s;
        }
        .item-list li:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .item-title { font-weight: bold; color: #fff; text-decoration: none; display: block; margin-bottom: 5px;}
        .item-meta { font-size: 12px; color: #ccc; }
        
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #loader { text-align: center; display: none; margin: 20px 0; }
        .error-msg { color: #ff6b6b; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-panel">
        <h1>Blogger Analyzer Panel</h1>
        <div class="search-box">
            <input type="text" id="blogUrl" placeholder="Nhập URL Blogspot (VD: https://ten-blog.blogspot.com)" />
            <button onclick="analyzeBlog()">Phân Tích</button>
        </div>
        <div id="loader">Đang trích xuất dữ liệu, vui lòng đợi...</div>
        <div id="errorBox" class="error-msg"></div>
    </div>

    <div class="glass-panel" id="dashboard" style="display: none;">
        <h2>Thông Tin Tổng Quan</h2>
        <div class="stats-grid">
            <div class="stat-card"><h3>Tên Blog</h3><p id="s-name">-</p></div>
            <div class="stat-card"><h3>Ngày Tạo (Cũ nhất)</h3><p id="s-published">-</p></div>
            <div class="stat-card"><h3>Cập Nhật Cuối</h3><p id="s-updated">-</p></div>
            <div class="stat-card"><h3>Tổng Bài Đăng</h3><p id="s-posts">-</p></div>
            <div class="stat-card"><h3>Tổng Trang (Pages)</h3><p id="s-pages">-</p></div>
            <div class="stat-card"><h3>Ngôn Ngữ / Khu Vực</h3><p id="s-locale">-</p></div>
        </div>
        <div class="stats-grid" style="margin-top: 10px;">
            <div class="stat-card" style="grid-column: span 2;">
                <h3>Mô Tả Blog (Meta)</h3>
                <p id="s-desc" style="font-size: 16px; font-weight: normal;">-</p>
            </div>
            <div class="stat-card" style="grid-column: span 2;">
                <h3>Tác Giả Đăng Nhiều Nhất</h3>
                <p id="s-top-author" style="font-size: 18px;">-</p>
            </div>
        </div>
    </div>

    <div class="glass-panel" id="detailTabs" style="display: none;">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'tab-posts')">Bài Đăng Gần Đây</button>
            <button class="tab-btn" onclick="switchTab(event, 'tab-pages')">Trang (Pages)</button>
        </div>

        <div id="tab-posts" class="tab-content active">
            <ul class="item-list" id="list-posts"></ul>
        </div>
        
        <div id="tab-pages" class="tab-content">
            <ul class="item-list" id="list-pages"></ul>
        </div>
    </div>
</div>

<script>
    /**
     * MÃ HÓA CẤP ĐỘ CƠ BẢN
     * Việc "giấu kỹ" JS hoàn toàn ở client-side là không thể. 
     * Đoạn code dưới đây được viết theo cấu trúc logic chuẩn để bạn dễ dàng mang đi nén 
     * bằng các công cụ như Obfuscator.io (thiết lập String Array, Control Flow Flattening).
     */

    const _0x1a2b = "AIzaSyCB28jIXaeajU2-MGMrV_80mXq5PGWZbPA"; // API Key của bạn
    const BASE_API = "https://www.googleapis.com/blogger/v3";

    async function analyzeBlog() {
        const urlInput = document.getElementById('blogUrl').value.trim();
        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('errorBox');
        const dashboard = document.getElementById('dashboard');
        const detailTabs = document.getElementById('detailTabs');

        if(!urlInput) {
            showError("Vui lòng nhập URL hợp lệ!"); return;
        }

        loader.style.display = 'block';
        errorBox.style.display = 'none';
        dashboard.style.display = 'none';
        detailTabs.style.display = 'none';

        try {
            // 1. Lấy thông tin Blog ID từ URL
            const blogRes = await fetch(`${BASE_API}/blogs/byurl?url=${encodeURIComponent(urlInput)}&key=${_0x1a2b}`);
            if (!blogRes.ok) throw new Error("Không tìm thấy blog hoặc URL không hợp lệ.");
            const blogData = await blogRes.json();
            const blogId = blogData.id;

            // Đổ dữ liệu tổng quan
            document.getElementById('s-name').innerText = blogData.name || "Không có tiêu đề";
            document.getElementById('s-desc').innerText = blogData.description || "Không có mô tả meta";
            document.getElementById('s-published').innerText = formatDate(blogData.published);
            document.getElementById('s-updated').innerText = formatDate(blogData.updated);
            document.getElementById('s-posts').innerText = blogData.posts ? blogData.posts.totalItems : 0;
            document.getElementById('s-pages').innerText = blogData.pages ? blogData.pages.totalItems : 0;
            document.getElementById('s-locale').innerText = blogData.locale ? `${blogData.locale.language}-${blogData.locale.country}` : "Không xác định";

            // 2. Fetch Bài viết (Lấy max 50 bài để phân tích tác giả & hiển thị)
            const postsRes = await fetch(`${BASE_API}/blogs/${blogId}/posts?maxResults=50&fetchImages=true&key=${_0x1a2b}`);
            const postsData = postsRes.ok ? await postsRes.json() : { items: [] };
            
            // Phân tích tác giả đăng nhiều nhất
            let authorCount = {};
            let topAuthor = "Chưa có dữ liệu";
            let maxPosts = 0;
            
            const postListUl = document.getElementById('list-posts');
            postListUl.innerHTML = '';

            if(postsData.items && postsData.items.length > 0) {
                postsData.items.forEach(post => {
                    // Đếm tác giả
                    const authorName = post.author ? post.author.displayName : "Ẩn danh";
                    authorCount[authorName] = (authorCount[authorName] || 0) + 1;
                    if(authorCount[authorName] > maxPosts) {
                        maxPosts = authorCount[authorName];
                        topAuthor = `${authorName} (${maxPosts} bài)`;
                    }

                    // Render list
                    postListUl.innerHTML += `
                        <li>
                            <div>
                                <a href="${post.url}" target="_blank" class="item-title">${post.title}</a>
                                <span class="item-meta">Đăng bởi: ${authorName} | Ngày: ${formatDate(post.published)} | Comments: ${post.replies ? post.replies.totalItems : 0}</span>
                            </div>
                        </li>
                    `;
                });
            } else {
                postListUl.innerHTML = '<li>Không có bài đăng nào.</li>';
            }
            document.getElementById('s-top-author').innerText = topAuthor;

            // 3. Fetch Trang (Pages)
            const pagesRes = await fetch(`${BASE_API}/blogs/${blogId}/pages?key=${_0x1a2b}`);
            const pagesData = pagesRes.ok ? await pagesRes.json() : { items: [] };
            const pageListUl = document.getElementById('list-pages');
            pageListUl.innerHTML = '';

            if(pagesData.items && pagesData.items.length > 0) {
                pagesData.items.forEach(page => {
                    pageListUl.innerHTML += `
                        <li>
                            <div>
                                <a href="${page.url}" target="_blank" class="item-title">${page.title}</a>
                                <span class="item-meta">Ngày tạo: ${formatDate(page.published)}</span>
                            </div>
                        </li>
                    `;
                });
            } else {
                pageListUl.innerHTML = '<li>Không có trang tĩnh nào.</li>';
            }

            // Hiển thị UI
            loader.style.display = 'none';
            dashboard.style.display = 'block';
            detailTabs.style.display = 'block';

        } catch (error) {
            loader.style.display = 'none';
            showError(error.message);
        }
    }

    function showError(msg) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = msg;
        errorBox.style.display = 'block';
    }

    function formatDate(isoString) {
        if(!isoString) return "-";
        const d = new Date(isoString);
        return d.toLocaleDateString('vi-VN') + " " + d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
    }

    function switchTab(evt, tabName) {
        const tabContents = document.getElementsByClassName("tab-content");
        for (let i = 0; i < tabContents.length; i++) {
            tabContents[i].classList.remove("active");
        }
        const tabBtns = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < tabBtns.length; i++) {
            tabBtns[i].classList.remove("active");
        }
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }
</script>

</body>
</html>
